<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BSO TV — Bent Steering Offroad</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B1530'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-style='italic' font-size='23' fill='%23FFFFFF'%3EBSO%3C/text%3E%3Crect x='12' y='46' width='40' height='5' rx='2.5' fill='%23E0262F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Saira+Condensed:wght@600;700&display=swap">
<style>
:root{--bg:#05091A;--panel:rgba(8,15,36,.9);--panel-solid:#0B1530;--ink:#FFFFFF;--muted:#A9B4D0;--red:#E0262F;--blue:#2563D9;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}
html{font-size:clamp(11px,.8333vw,26px)}
@media (max-aspect-ratio:1/1){html{font-size:13px}}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font-family:'Saira',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible{outline:.25rem solid var(--ink);outline-offset:.2rem}

#stage{position:fixed;inset:0;background:#000;overflow:hidden}
#player,#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#touch{position:fixed;inset:0;touch-action:none}

.bug{position:fixed;right:3rem;top:2.5rem;width:13rem;opacity:0;pointer-events:none;transition:opacity .35s ease}
body.ui .bug{opacity:.42}      /* the logo shows with the info banner, not over the show */

/* boot */
#boot{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;overflow:hidden}
#boot[hidden]{display:none}
.boot-inner{position:relative;width:min(80vw,96rem);display:flex;flex-direction:column;align-items:center;gap:4rem}
.boot-mark{width:100%;opacity:0;transform:translateX(-12%) skewX(-8deg);animation:markIn 1.1s cubic-bezier(.2,.8,.2,1) .35s forwards}
@keyframes markIn{60%{opacity:1;transform:translateX(1.2%) skewX(0)}100%{opacity:1;transform:none}}
.streaks{position:absolute;left:-14%;top:50%;width:30%;display:flex;flex-direction:column;gap:2.2rem;transform:translateY(-140%)}
.streaks i{display:block;height:.45rem;border-radius:.3rem;opacity:0;animation:streak .9s ease-out forwards}
.streaks i:nth-child(1){background:var(--red);width:100%;animation-delay:.2s}
.streaks i:nth-child(2){background:#fff;width:72%;margin-left:20%;animation-delay:.28s}
.streaks i:nth-child(3){background:var(--blue);width:88%;margin-left:6%;animation-delay:.36s}
@keyframes streak{0%{opacity:0;transform:translateX(-60%)}40%{opacity:.95}100%{opacity:0;transform:translateX(70%)}}
.boot-line{width:min(28rem,60vw);height:.35rem;border-radius:.2rem;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;animation:fade .4s ease 1.2s forwards}
.boot-line i{display:block;height:100%;width:0;background:var(--red);animation:load 1.6s ease-in-out 1.3s forwards}
@keyframes load{to{width:100%}}
@keyframes fade{to{opacity:1}}
.tune-in{opacity:0;border:0;background:none;cursor:pointer;font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:.32em;color:var(--muted);
  animation:fade .5s ease 2.9s forwards, pulse 2s ease-in-out 3.4s infinite}
@keyframes pulse{50%{color:#fff}}
.tune-in .key{display:inline-block;padding:.15rem .7rem;margin:0 .4rem;border-radius:.45rem;box-shadow:inset 0 0 0 .14rem rgba(255,255,255,.35);color:#fff;letter-spacing:.14em}

/* info banner */
.banner{position:fixed;left:3.5rem;right:3.5rem;bottom:3rem;z-index:5;display:flex;align-items:stretch;gap:0;border-radius:1.25rem;overflow:hidden;
  background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1.5rem 3rem rgba(0,0,0,.5);
  transition:opacity .35s ease, transform .35s ease}
.banner.hide{opacity:0;transform:translateY(1.5rem);pointer-events:none}
.ch-num{flex:0 0 auto;min-width:11rem;padding:1.5rem 1.75rem;background:var(--red);display:flex;flex-direction:column;justify-content:center;align-items:center}
.ch-num small{font-family:'Saira Condensed',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.24em;opacity:.9}
.ch-num b{font-size:4.2rem;font-weight:900;font-style:italic;line-height:1;font-variant-numeric:tabular-nums}
.ch-info{flex:1;min-width:0;padding:1.5rem 2rem;display:flex;flex-direction:column;gap:.35rem}
.ch-top{display:flex;align-items:center;gap:1rem}
.ch-name{font-size:2.3rem;font-weight:900;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{flex:0 0 auto;padding:.15rem .7rem;border-radius:.4rem;background:var(--red);font-family:'Saira Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.18em}
.live.off{background:rgba(255,255,255,.14)}
.live.start{background:var(--blue)}
.ch-title{font-size:1.5rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{display:flex;align-items:center;gap:1rem;margin-top:.4rem;font-family:'Saira Condensed',sans-serif;font-size:1.15rem;font-weight:600;color:#7F8BAA;font-variant-numeric:tabular-nums}
.bar{flex:1;height:.4rem;border-radius:.2rem;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red)}
.ch-btns{flex:0 0 auto;display:flex;align-items:center;gap:.75rem;padding:0 1.75rem}
.ch-btns button{width:4rem;height:4rem;border:0;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer}
.ch-btns button.wide{width:auto;padding:0 1.4rem;border-radius:2rem;font-family:'Saira Condensed',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.16em}
.ch-btns svg{width:1.6rem;height:1.6rem}
.ch-btns button.on{background:#fff;color:#0A1638}
.row.setting.first{margin-top:1rem;box-shadow:inset 0 1px 0 var(--line)}
.row .state{flex:0 0 auto;padding:.1rem .55rem;border-radius:.35rem;background:rgba(255,255,255,.14);font-family:'Saira Condensed',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.16em}
.row .state.on{background:var(--blue);color:#fff}
.hint{position:fixed;right:3.5rem;bottom:calc(3rem + 11.5rem);z-index:5;font-family:'Saira Condensed',sans-serif;font-size:1.2rem;font-weight:700;letter-spacing:.14em;color:var(--muted);
  display:flex;gap:.75rem;align-items:center;transition:opacity .35s ease;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.hint .key{padding:.12rem .6rem;border-radius:.4rem;box-shadow:inset 0 0 0 .13rem rgba(255,255,255,.35);color:#fff}
.hint.hide{opacity:0}

/* guide */
.guide{position:fixed;left:0;top:0;bottom:0;width:min(44rem,92vw);z-index:8;background:linear-gradient(90deg,rgba(5,9,26,.97) 70%,rgba(5,9,26,.85));
  box-shadow:1rem 0 3rem rgba(0,0,0,.5);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .3s ease}
.guide.open{transform:none}
.guide header{padding:2.5rem 2.5rem 1.25rem;display:flex;flex-direction:column;gap:1rem}
.guide header img{width:20rem}
.guide header span{font-family:'Saira Condensed',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:.24em;color:var(--muted)}
.list{flex:1;overflow-y:auto;padding:0 1.5rem 2rem;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}
.row{width:100%;display:flex;align-items:center;gap:1.25rem;padding:.85rem 1rem;border:0;border-radius:.9rem;background:none;text-align:left;cursor:pointer}
.row .n{flex:0 0 3.4rem;font-family:'Saira Condensed',sans-serif;font-size:1.5rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0;font-size:1.6rem;font-weight:800;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .now{flex:0 0 auto;padding:.1rem .55rem;border-radius:.35rem;background:var(--red);font-family:'Saira Condensed',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.16em}
.row.cursor{background:#fff;color:#0A1638}
.row.cursor .n{color:#0A1638}

.notice{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:6;max-width:44rem;padding:1.75rem 2.25rem;border-radius:1.2rem;
  background:var(--panel-solid);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.notice[hidden]{display:none}
.notice h2{margin:0 0 .5rem;font-size:2rem;font-style:italic;font-weight:900}
.notice p{margin:0;font-size:1.35rem;color:var(--muted);line-height:1.4}
.static{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .25s ease;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px),var(--bg)}
.static.on{opacity:1}
.static .tuning{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-family:'Saira Condensed',sans-serif;font-size:1.6rem;font-weight:700;letter-spacing:.3em;color:var(--muted)}
.numentry{position:fixed;right:3rem;top:6.5rem;z-index:7;padding:.4rem 1.2rem;border-radius:.6rem;background:var(--panel-solid);font-size:3rem;font-weight:900;font-style:italic;font-variant-numeric:tabular-nums}
.numentry[hidden]{display:none}

/* commercial break: covers YouTube's ads with a BSO slate */
.adbreak{position:fixed;inset:0;z-index:4;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s ease;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 2px,transparent 2px 4px),radial-gradient(ellipse at 50% 42%,#10204D 0%,var(--bg) 68%)}
.adbreak.on{opacity:1}
.ab-inner{display:flex;flex-direction:column;align-items:center;gap:1.6rem;text-align:center;width:min(86vw,72rem)}
.ab-inner img{width:min(52rem,72vw);margin-bottom:1.4rem}
.ab-stripes{width:min(30rem,60vw);display:flex;flex-direction:column;gap:.6rem;overflow:hidden}
.ab-stripes i{display:block;height:.4rem;border-radius:.3rem;animation:abRun 2.4s ease-in-out infinite}
.ab-stripes i:nth-child(1){background:var(--red)}
.ab-stripes i:nth-child(2){background:#fff;width:72%;animation-delay:.12s}
.ab-stripes i:nth-child(3){background:var(--blue);width:88%;animation-delay:.24s}
@keyframes abRun{0%{transform:translateX(-105%)}45%,55%{transform:translateX(0)}100%{transform:translateX(140%)}}
.ab-title{margin:1rem 0 0;font-size:5.2rem;font-weight:900;font-style:italic;line-height:1;letter-spacing:.01em}
.ab-sub{margin:0;font-size:1.8rem;font-weight:600;color:var(--muted)}
.ab-ch{margin-top:.6rem;font-family:'Saira Condensed',sans-serif;font-size:1.3rem;font-weight:700;letter-spacing:.24em;color:#7F8BAA}
.ab-note{position:absolute;left:0;right:0;bottom:2.5rem;margin:0;padding:0 2rem;font-family:'Saira Condensed',sans-serif;font-size:1.15rem;font-weight:600;letter-spacing:.12em;color:#6C789A}

@media (max-aspect-ratio:1/1){
  .bug{width:8rem;right:1rem;top:1rem}
  .banner{left:.75rem;right:.75rem;bottom:calc(.75rem + env(safe-area-inset-bottom));flex-wrap:wrap}
  .ch-num{min-width:6.5rem;padding:1rem} .ch-num b{font-size:2.6rem} .ch-num small{font-size:.9rem}
  .ch-info{padding:1rem 1.1rem} .ch-name{font-size:1.5rem} .ch-title{font-size:1.05rem}
  .ch-btns{width:100%;justify-content:space-between;gap:.4rem;padding:0 1rem 1rem}
  .ch-btns button.wide{padding:0 .85rem}
  .hint{display:none}
  .ab-title{font-size:2.6rem} .ab-sub{font-size:1.15rem} .ab-ch{font-size:.95rem} .ab-note{font-size:.85rem;bottom:1.5rem}
}
</style>
</head>

function fitStage() {

  const W = window.innerWidth, H = window.innerHeight;
  const pad = Math.round(Math.max(90, H * 0.14));

  const cover = fillOn && W >= H && aspect > 1.1 && aspect < 2.5;

// whenever a video starts or jumps), unless a commercial break is covering the screen.
const REVEAL_DELAY = 2000;
function reveal() { if (!adOn) els.stat.classList.remove('on'); }

function onReady() {
  const f = player.getIframe && player.getIframe();
  if (f) { f.setAttribute('tabindex', '-1'); f.setAttribute('aria-hidden', 'true'); }
  fitStage();
  // YouTube's player announces its ads with events that aren't in its public docs.
  // If YouTube ever drops them, ads simply show as before.
  try {
    player.addEventListener('onAdStart', () => adBreak(true));
    player.addEventListener('onAdEnd', () => adBreak(false));
    player.addEventListener('onAdStateChange', (e) => { if (e && e.data === -1) adBreak(false); else if (e && (e.data === 1 || e.data === 3)) adBreak(true); });
  } catch (err) { /* no ad events: nothing to cover */ }
  if (resume && started && resume.ch === chIndex) {
    const r = resume; resume = null;
    prog = { seq: r.seq, tries: 0, token: ++token, live: false, vid: r.vid, seeked: false, pinned: r.pinned };
    shapeFor(r.vid);
    player.loadVideoById({ videoId: r.vid, startSeconds: r.t });
    if (muted) player.mute(); else player.unMute();
    return;
  }
  resume = null;
  if (started) tune(chIndex, true);
}
function onStateChange(e) {
  const s = e.data;
  if (cueWaiter && (s === YT.PlayerState.CUED || s === YT.PlayerState.UNSTARTED)) { cueWaiter(); return; }
  if (!prog || prog.token !== token) return;
  if (s === YT.PlayerState.PLAYING) {
    hideNotice();
    if (!prog.seeked) {
      const d = player.getDuration() || 0;
      const data = player.getVideoData ? player.getVideoData() : {};
      if (d < MIN_LEN || (data && data.isLive)) { markBad(prog.vid); return next(prog.live); }   // tuning screen stays up while skipping
      prog.seeked = true;
      const my = prog.token, vid = prog.vid;
      if (!ccOn) {
        captionsOff();
        setTimeout(() => { if (prog && prog.vid === vid && !ccOn) captionsOff(); }, 1500);
        setTimeout(() => { if (prog && prog.vid === vid && !ccOn) captionsOff(); }, 4000);
      }
      if (prog.live) player.seekTo(liveOffset(d), true);
      showInfo();
      prog.revealAt = Date.now() + REVEAL_DELAY;
      setTimeout(() => { if (prog && prog.token === my && prog.vid === vid) reveal(); }, REVEAL_DELAY);
    } else if (!prog.revealAt || Date.now() >= prog.revealAt) reveal();
  } else if (s === YT.PlayerState.ENDED) {
    next(false);
  }
}
function onError() {
  if (cueWaiter) { cueWaiter(); return; }
  if (!prog || prog.token !== token) return;
  markBad(prog.vid);
  next(prog.live);
}
function markBad(v) { if (!v) return; bad.add(v); store.set('bad', [...bad].slice(-400)); }

function cueList(list, wait) {
  // Ask the player for a playlist; it hands back the video ids it can see. Only trust the answer once
  // the player says it holds this exact list (a failed load can leave the previous list behind).
  return new Promise((resolve) => {
    const t0 = Date.now(), limit = wait || 9000;
    let done = false, poll = 0;
    const finish = (ids) => { if (done) return; done = true; clearInterval(poll); cueWaiter = null; resolve(ids); };
    poll = setInterval(() => {
      const same = !player.getPlaylistId || player.getPlaylistId() === list;
      const ids = same && player.getPlaylist ? (player.getPlaylist() || []) : [];
      const waited = Date.now() - t0;
      if (ids.length) finish(ids);
      else if (waited > limit || (same && waited > 3000 && player.getPlayerState() === YT.PlayerState.CUED)) finish([]);
    }, 250);
    cueWaiter = () => {};     // swallow the player's cue/error events while the list loads
    player.cuePlaylist({ listType: 'playlist', list, index: 0 });
  });
}
async function cueUploads(ch) {
  if (ch.list) return cueList(ch.list);                          // a show playlist
  const ids = await cueList('UULF' + ch.id.slice(2), 5000);      // creator's long videos only (no Shorts)
  return ids.length ? ids : cueList('UU' + ch.id.slice(2));      // or all their uploads
}
async function idsFor(ch) {
  if (ch.ids) return ch.ids;
  if (playlists.has(ch.id)) return playlists.get(ch.id);
  let ids;
  if (ch.mix) {
    // Each creator gets an equal share of airtime: a smaller library is repeated to match the biggest one.
    const lists = [];
    for (const id of ch.mix) { const l = await idsFor({ id }); if (l.length) lists.push(l); }
    const most = Math.max(0, ...lists.map((l) => l.length));
    ids = [];
    for (const l of lists) for (let i = 0; i < most; i++) ids.push(l[i % l.length]);
  } else {
    const cached = store.get('lf:' + ch.id, null);
    if (cached && Date.now() - cached.t < 12 * 3600000 && cached.ids.length) { playlists.set(ch.id, cached.ids); return cached.ids; }
    ids = await cueUploads(ch);
    if (ids.length) store.set('lf:' + ch.id, { t: Date.now(), ids });
  }
  if (ids.length) playlists.set(ch.id, ids);
  return ids;
}

/* ---------- commercial breaks ---------- */
// The ad still plays inside YouTube's player (a page can't block it); BSO TV covers it
// with its own slate and mutes it, then brings the show back when the ad ends.
// While an ad runs, YouTube reports the show as not started and the clock belongs to the ad.
// Ads often come in pairs, so the slate waits a moment before dropping, to skip a flash between them.
let adOn = false, adFailsafe = 0, adOffTimer = 0;
function adBreak(on, now) {
  clearTimeout(adOffTimer);
  if (!on && adOn && !now) { adOffTimer = setTimeout(() => adBreak(false, true), 800); return; }
  if (on === adOn) return;
  adOn = on;
  clearTimeout(adFailsafe);
  if (on) {
    els.abCh.textContent = 'CH ' + pad2(chIndex + 1) + ' \u00b7 ' + CHANNELS[chIndex].name.toUpperCase();
    els.stat.classList.remove('on');           // the slate replaces the tuning screen
    els.ad.classList.add('on');
    if (player && player.mute) player.mute();
    adFailsafe = setTimeout(() => adBreak(false), 4 * 60000);   // never leave the slate stuck up
  } else {
    if (prog && prog.token === token && !prog.seeked) els.stat.classList.add('on');   // show starts behind the tuning screen
    els.ad.classList.remove('on');
    if (player && player.unMute && !muted) player.unMute();
  }
}

/* ---------- tuning ---------- */
async function tune(i, quiet) {
  i = (i + CHANNELS.length) % CHANNELS.length;
  if (i !== chIndex) prevIndex = chIndex;
  chIndex = i; store.set('last', i);
  const ch = CHANNELS[i], my = ++token;
  hideNotice(); adBreak(false, true);
  els.stat.classList.add('on'); els.tuning.textContent = 'TUNING CH ' + pad2(i + 1) + '…';
  setBanner(ch, '', true);
  if (!quiet) showBanner();
  renderGuide();
  if (LOCAL) { els.tuning.textContent = ''; showNotice(...NEED_LINK); return; }
  if (ytBlocked) { els.tuning.textContent = ''; showNotice(...NO_YT); return; }
  // If nothing is on screen after 20 s, say so instead of tuning forever.
  clearTimeout(watchdog);
  watchdog = setTimeout(() => {
    if (my !== token || !els.stat.classList.contains('on') || !els.notice.hidden) return;
    els.tuning.textContent = '';
    if (ytBlocked || !apiReady || !player || !player.cuePlaylist) showNotice(...NO_YT);
    else showNotice('Still tuning ' + ch.name, 'YouTube isn\'t answering. Check the internet connection, or press ▲ or ▼ to try another channel.');
  }, 20000);
  if (!apiReady || !player || !player.cuePlaylist) return;      // onReady will tune once the player exists
  const ids = await idsFor(ch);
  if (my !== token) return;
  if (!ids.length) { unavailable(ch); return; }
  prog = { seq: 0, tries: 0, token: my, live: true };
  play(ch, ids, true);
}
function play(ch, ids, live) {
  const vid = pickVideo(ch, ids, prog.seq);
  prog.vid = vid; prog.seeked = false; prog.live = live; prog.pinned = false;
  adBreak(false, true);
  shapeFor(vid);
  player.loadVideoById({ videoId: vid });
  if (muted) player.mute(); else player.unMute();
}
function next(live) {
  const ch = CHANNELS[chIndex], ids = ch.ids || playlists.get(ch.id) || [];
  if (!prog || !ids.length) return;
  prog.seq++; prog.tries++;
  if (prog.tries > MAX_TRIES) { unavailable(ch); return; }
  play(ch, ids, live);
}
function unavailable(ch) {
  els.stat.classList.add('on'); els.tuning.textContent = '';
  showNotice(ch.name + ' is off the air', 'YouTube would not play this channel\'s videos here. Press ▲ or ▼ to change the channel.');
}
// Restart: play the current video from the top and keep it on until it ends (the hourly
// schedule change skips a restarted video). Flipping away and back returns to live.
function restart() {
  if (!player || !player.seekTo || !prog || !prog.seeked || prog.token !== token || adOn) { showBanner(); return; }
  prog.pinned = true; prog.live = false;
  player.seekTo(0, true); player.playVideo();
  showInfo();
}
// Top of the hour: every channel rolls to its next program from the start, like a TV schedule.
let lastHour = hourNow();
setInterval(() => {
  const h = hourNow();
  if (h !== lastHour && started && prog && !prog.pinned) { lastHour = h; prog.seq = -1; next(false); prog.tries = 0; }
  lastHour = h;
  if (!els.banner.classList.contains('hide')) updateProgress();
}, 1000);

/* ---------- banner / guide ---------- */
// state: true = LIVE, false = PAUSED, 'start' = FROM START (restarted)
function setBanner(ch, title, state) {
  els.num.textContent = pad2(chIndex + 1);
  els.name.textContent = ch.name;
  els.title.textContent = title || ' ';
  els.live.className = 'live' + (state === 'start' ? ' start' : state ? '' : ' off');
  els.live.textContent = state === 'start' ? 'FROM START' : state ? 'LIVE' : 'PAUSED';
}
const playingBadge = () => (prog && prog.pinned ? 'start' : true);
function showInfo() {
  const data = player.getVideoData ? player.getVideoData() : {};
  setBanner(CHANNELS[chIndex], data && data.title, playingBadge());
  updateProgress();
  showBanner();
}
function updateProgress() {
  if (!player || !player.getDuration) return;
  const d = player.getDuration() || 0, c = player.getCurrentTime ? player.getCurrentTime() : 0;
  els.cur.textContent = fmt(c); els.dur.textContent = fmt(d);
  els.bar.style.width = d ? (c / d * 100).toFixed(2) + '%' : '0%';
}
let bannerTimer = 0;
function showBanner() {
  els.banner.classList.remove('hide'); els.hint.classList.remove('hide'); document.body.classList.add('ui');
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(() => { if (!guideOpen) { els.banner.classList.add('hide'); els.hint.classList.add('hide'); document.body.classList.remove('ui'); } }, 6000);
}
function showNotice(t, x) { els.nTitle.textContent = t; els.nText.textContent = x; els.notice.hidden = false; }
function hideNotice() { els.notice.hidden = true; }
function renderGuide() {
  if (!els.list.children.length) {
    CHANNELS.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'row'; b.type = 'button';
      b.innerHTML = '<span class="n"></span><span class="t"></span>';
      b.querySelector('.n').textContent = pad2(i + 1);
      b.querySelector('.t').textContent = ch.name;
      b.addEventListener('click', () => { closeGuide(); start(); tune(i); });
      els.list.appendChild(b);
    });
    SETTINGS.forEach((st, j) => {
      const b = document.createElement('button');
      b.className = 'row setting' + (j ? '' : ' first'); b.type = 'button'; b.dataset.setting = st.key;
      b.innerHTML = '<span class="n"></span><span class="t"></span><span class="state"></span>';
      b.querySelector('.n').textContent = st.tag;
      b.querySelector('.t').textContent = st.label;
      b.addEventListener('click', st.toggle);
      els.list.appendChild(b);
    });
    setSettingLabels();
  }
  [...els.list.children].forEach((b, i) => {
    b.classList.toggle('cursor', guideOpen && i === guideCursor);
    let now = b.querySelector('.now');
    if (i === chIndex && !now) { now = document.createElement('span'); now.className = 'now'; now.textContent = 'NOW'; b.appendChild(now); }
    if (i !== chIndex && now) now.remove();
  });
  const c = els.list.children[guideOpen ? guideCursor : chIndex];
  if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest' });
}
function openGuide() { guideOpen = true; guideCursor = chIndex; els.guide.classList.add('open'); renderGuide(); showBanner(); }
function closeGuide() { guideOpen = false; els.guide.classList.remove('open'); renderGuide(); }

/* ---------- start (needs one press/tap so the browser allows sound) ---------- */
function goFullscreen() {
  const el = document.documentElement;
  if (document.fullscreenElement || document.webkitFullscreenElement) return;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;                                    // e.g. iPhone Safari: no page fullscreen
  try { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => {}); } catch (e) { /* not allowed here */ }
}
function start() {
  if (started) return;
  goFullscreen();
  started = true;
  els.boot.hidden = true;
  tune(chIndex);           // shows the tuning screen; plays now, or once the player is ready
}
els.tuneIn.addEventListener('click', start);

/* ---------- remote / keyboard ---------- */
let numBuf = '', numTimer = 0;
function typeNumber(d) {
  numBuf = (numBuf + d).slice(-2);
  els.numentry.textContent = numBuf; els.numentry.hidden = false;
  clearTimeout(numTimer);
  numTimer = setTimeout(() => {
    const n = parseInt(numBuf, 10); numBuf = ''; els.numentry.hidden = true;
    if (n >= 1 && n <= CHANNELS.length) tune(n - 1);
  }, 1300);
}
function togglePause() {
  if (!player || !player.getPlayerState) return;
  if (player.getPlayerState() === YT.PlayerState.PLAYING) { player.pauseVideo(); setBanner(CHANNELS[chIndex], els.title.textContent, false); }
  else { player.playVideo(); setBanner(CHANNELS[chIndex], els.title.textContent, playingBadge()); }
  showBanner();
}
// Settings at the bottom of the guide, so the Fire Stick remote can reach them (▼ past the last channel, OK).
const SETTINGS = [
  { key: 'cc', tag: 'CC', label: 'Captions', get: () => ccOn, on: 'ON', off: 'OFF', toggle: () => toggleCaptions() },
  { key: 'fill', tag: '\u25A3', label: 'Picture', get: () => fillOn, on: 'FILL', off: 'FIT', toggle: () => toggleFill() },
];
function setSettingLabels() {
  const b = $('btn-cc');
  b.classList.toggle('on', ccOn); b.setAttribute('aria-pressed', String(ccOn));
  SETTINGS.forEach((st) => {
    const el = els.list.querySelector('[data-setting="' + st.key + '"] .state');
    if (el) { el.textContent = st.get() ? st.on : st.off; el.classList.toggle('on', st.get()); }
  });
}
function toggleFill() { fillOn = !fillOn; store.set('fill', fillOn); setSettingLabels(); fitStage(); showBanner(); }
function toggleCaptions() {
  ccOn = !ccOn; store.set('cc', ccOn); setSettingLabels(); showBanner();
  if (!player || !apiReady) return;
  if (prog && prog.seeked && prog.token === token && player.getCurrentTime) {
    resume = { ch: chIndex, vid: prog.vid, t: Math.max(0, player.getCurrentTime() - 1), seq: prog.seq, pinned: !!prog.pinned };
  }
  token++;                                   // ignore anything the old player still reports
  try { player.destroy(); } catch (e) { /* already gone */ }
  player = null; adBreak(false, true);
  if (!$('player')) { const d = document.createElement('div'); d.id = 'player'; $('stage').appendChild(d); }
  fitStage();
  if (started) { els.stat.classList.add('on'); els.tuning.textContent = ccOn ? 'CAPTIONS ON' : 'CAPTIONS OFF'; }
  makePlayer();                              // onReady picks the show back up
}
function toggleSound() {
  if (!player) return;
  muted = !muted;
  if (muted) player.mute(); else if (!adOn) player.unMute();
  els.sound.textContent = muted ? 'SOUND ON' : 'MUTE';
  showBanner();
}
window.addEventListener('keydown', (e) => {
  const k = e.key, code = e.keyCode;
  if (started && (k === 'Enter' || code === 23)) goFullscreen();
  if (!started) {
    if (k === 'Enter' || k === ' ' || code === 23 || code === 179) { e.preventDefault(); start(); }
    return;
  }
  if (guideOpen) {
    if (k === 'ArrowUp') guideCursor = Math.max(0, guideCursor - 1);
    else if (k === 'ArrowDown') guideCursor = Math.min(CHANNELS.length + SETTINGS.length - 1, guideCursor + 1);   // settings below the channels
    else if ((k === 'Enter' || k === ' ') && guideCursor >= CHANNELS.length) SETTINGS[guideCursor - CHANNELS.length].toggle();
    else if (k === 'Enter' || k === ' ') { closeGuide(); tune(guideCursor); }
    else if (k === 'ArrowLeft' || k === 'Escape' || k === 'Backspace' || k === 'GoBack' || code === 4) closeGuide();
    else return;
    e.preventDefault(); renderGuide(); return;
  }
  if (k === 'ArrowUp' || k === 'PageUp' || k === 'ChannelUp' || code === 166) tune(chIndex + 1);
  else if (k === 'ArrowDown' || k === 'PageDown' || k === 'ChannelDown' || code === 167) tune(chIndex - 1);
  else if (k === 'Enter' || k === ' ' || code === 23) openGuide();
  else if (k === 'ArrowLeft') tune(prevIndex);
  else if (k === 'ArrowRight' || k === 'r') restart();
  else if (k === 'i') { if (prog && prog.seeked) showInfo(); else showBanner(); }
  else if (k === 'MediaPlayPause' || code === 179 || k === 'p') togglePause();
  else if (k === 'MediaFastForward' || code === 228) { player.seekTo(player.getCurrentTime() + 30, true); showBanner(); }
  else if (k === 'MediaRewind' || code === 227) { player.seekTo(Math.max(0, player.getCurrentTime() - 30), true); showBanner(); }
  else if (k === 'm') toggleSound();
  else if (k === 'c') toggleCaptions();
  else if (k === 'z') toggleFill();
  else if (/^[0-9]$/.test(k)) typeNumber(k);
  else return;
  e.preventDefault();
});

/* ---------- touch / mouse ---------- */
const touch = $('touch');
let ty = null, tx = null;
touch.addEventListener('pointerdown', (e) => { ty = e.clientY; tx = e.clientX; });
touch.addEventListener('pointerup', (e) => {
  if (!started) { start(); return; }
  if (ty == null) return;
  const dy = e.clientY - ty, dx = e.clientX - tx; ty = tx = null;
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) tune(chIndex + (dy < 0 ? 1 : -1));
  else if (guideOpen) closeGuide();
  else showBanner();
});
touch.addEventListener('wheel', (e) => { if (!started) return; e.preventDefault(); clearTimeout(touch._w); touch._w = setTimeout(() => tune(chIndex + (e.deltaY < 0 ? 1 : -1)), 120); }, { passive: false });
$('btn-up').addEventListener('click', () => tune(chIndex + 1));
$('btn-down').addEventListener('click', () => tune(chIndex - 1));
$('btn-restart').addEventListener('click', restart);
$('btn-guide').addEventListener('click', () => (guideOpen ? closeGuide() : openGuide()));
els.sound.addEventListener('click', toggleSound);
$('btn-cc').addEventListener('click', toggleCaptions);
els.sound.textContent = 'MUTE';

renderGuide();
const s = document.createElement('script');
s.src = 'https://www.youtube.com/iframe_api';
s.onerror = () => { ytBlocked = true; if (started) { els.tuning.textContent = ''; showNotice(...NO_YT); } };
if (!LOCAL) document.head.appendChild(s);
})();
</script>
</body>
</html>
