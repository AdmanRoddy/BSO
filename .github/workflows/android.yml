name: Build Fire Stick app

# Builds Bent Steering TV (android/) into bso-tv.apk and publishes it to
# https://admanroddy.github.io/BSO/app/bso-tv.apk with app/version.json beside it,
# so the Fire Stick can install it with Downloader and offer updates from the home screen.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the app
        env:
          # The signing key is in the repo only in encrypted form (android/bso-tv.p12.enc);
          # its password lives in the repo's Actions secrets, never in the code.
          SIGNING_PASSWORD: ${{ secrets.BSO_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          exec > >(tee build.log) 2>&1
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          # newest stable tools and platform (skip betas and release candidates)
          BT=$(ls -d "$SDK"/build-tools/* | grep -E '/[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          PLAT="$(ls -d "$SDK"/platforms/android-* | grep -E '/android-[0-9]+$' | sort -V | tail -1)/android.jar"
          echo "build-tools: $BT"; echo "platform: $PLAT"
          VC=$((100 + GITHUB_RUN_NUMBER)); VN="1.0.$GITHUB_RUN_NUMBER"
          rm -rf build && mkdir -p build/gen build/classes build/dex build/assets/home
          # offline copy of the home screen, used when the website can't be reached
          cp home/index.html home/*.webp build/assets/home/
          "$BT/aapt2" compile --dir android/res -o build/res.zip
          "$BT/aapt2" link -o build/base.apk -I "$PLAT" --manifest android/AndroidManifest.xml \
            -A build/assets --java build/gen \
            --min-sdk-version 22 --target-sdk-version 30 --version-code "$VC" --version-name "$VN" \
            build/res.zip
          javac -source 8 -target 8 -bootclasspath "$PLAT" -cp "$PLAT" -Xlint:-options -encoding UTF-8 \
            -d build/classes $(find android/src build/gen -name '*.java')
          "$BT/d8" --release --min-api 22 --lib "$PLAT" --output build/dex $(find build/classes -name '*.class')
          cp build/base.apk build/unsigned.apk
          (cd build/dex && zip -q -j ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/unsigned.apk build/aligned.apk
          if [ -z "${SIGNING_PASSWORD:-}" ]; then
            echo "::warning::Built but not signed or published: add the BSO_SIGNING_PASSWORD secret (repo Settings > Secrets and variables > Actions > New repository secret), then run this again"
            "$BT/aapt2" dump badging build/aligned.apk | head -4
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          KEY="$RUNNER_TEMP/bso-tv.p12"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/bso-tv.p12.enc -out "$KEY" -pass env:SIGNING_PASSWORD
          "$BT/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias bsotv \
            --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --out build/bso-tv.apk build/aligned.apk
          rm -f "$KEY"
          "$BT/apksigner" verify build/bso-tv.apk
          "$BT/aapt2" dump badging build/bso-tv.apk | head -4
          ls -la build/bso-tv.apk
          echo "VC=$VC" >> "$GITHUB_ENV"
          echo "VN=$VN" >> "$GITHUB_ENV"

      - name: Publish to the website
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          mkdir -p app
          cp build/bso-tv.apk app/bso-tv.apk
          printf '{"versionCode":%s,"versionName":"%s","apk":"https://admanroddy.github.io/BSO/app/bso-tv.apk","built":"%s"}\n' \
            "$VC" "$VN" "$(date -u +%FT%TZ)" > app/version.json
          git config user.name "BSO build"
          git config user.email "actions@users.noreply.github.com"
          git add app/bso-tv.apk app/version.json
          git commit -m "Fire Stick app build $VN"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Save the build log if it failed
        if: failure()
        env:
          SIGNING_PASSWORD: ${{ secrets.BSO_SIGNING_PASSWORD }}
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no build log" > /tmp/build.log
          # never publish the password, even if a tool printed it
          if [ -n "${SIGNING_PASSWORD:-}" ]; then python3 -c "import os,sys;p='/tmp/build.log';s=open(p,errors='replace').read();open(p,'w').write(s.replace(os.environ['SIGNING_PASSWORD'],'***'))"; fi
          git config user.name "BSO build"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan ci-log-tmp
          git rm -rfq --cached . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "Build log for run $GITHUB_RUN_NUMBER"
          git push -f origin ci-log-tmp:ci-log
