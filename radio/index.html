<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J R-dio World Radio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@0,400;0,600;0,700;0,800;1,800;1,900&family=Saira+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#05091A; --panel:rgba(11,21,48,.93); --panel-solid:#0B1530; --ink:#FFFFFF; --muted:#A9B4D0;
  --red:#E0262F; --line:rgba(255,255,255,.14); --chip:#0F1B3D;
}
*{box-sizing:border-box}
html{font-size:clamp(11px,.8333vw,26px)}
@media (max-aspect-ratio:1/1){html{font-size:13px}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:'Saira',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
canvas#map{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
canvas#map.dragging{cursor:grabbing}
button{font:inherit;color:inherit}
button:focus-visible{outline:.25rem solid var(--ink);outline-offset:.25rem}

.top{position:fixed;left:4.5rem;top:3.2rem;display:flex;flex-direction:column;gap:1rem;pointer-events:none}
.logo{width:18.75rem;height:auto;display:block}
.meta .title{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:.24em}
.meta .sub{font-family:'Saira Condensed',sans-serif;font-weight:600;font-size:1.25rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}

.cats{position:fixed;left:27.5rem;right:4.5rem;top:3.5rem;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.75rem}
.cat{height:3rem;padding:0 1.25rem;border:0;border-radius:1.5rem;background:rgba(11,21,48,.85);color:#C9D2E8;
  box-shadow:inset 0 0 0 1px var(--line);font-family:'Saira Condensed',sans-serif;font-size:1.375rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--ink);color:#0A1638;box-shadow:none}
.cats.focus .cat.cursor{outline:.25rem solid var(--red);outline-offset:.2rem}

.reticle{position:fixed;left:50%;top:50%;width:8.25rem;height:8.25rem;margin:-4.125rem 0 0 -4.125rem;pointer-events:none}
.reticle .ring{position:absolute;inset:0;border:.25rem solid var(--red);border-radius:50%}
.reticle .ping{position:absolute;inset:0;border:.19rem solid var(--red);border-radius:50%;opacity:0}
.playing .reticle .ping{animation:ping 2.4s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
.reticle .t{position:absolute;background:var(--red)}
.reticle .t.n{left:calc(50% - .125rem);top:-1.4rem;width:.25rem;height:1rem}
.reticle .t.s{left:calc(50% - .125rem);bottom:-1.4rem;width:.25rem;height:1rem}
.reticle .t.w{top:calc(50% - .125rem);left:-1.4rem;width:1rem;height:.25rem}
.reticle .t.e{top:calc(50% - .125rem);right:-1.4rem;width:1rem;height:.25rem}
.place{position:fixed;left:50%;top:calc(50% + 6rem);transform:translateX(-50%);padding:.35rem 1rem;border-radius:1.2rem;
  background:rgba(5,9,26,.88);box-shadow:inset 0 0 0 1px var(--line);font-family:'Saira Condensed',sans-serif;
  font-size:1.375rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;pointer-events:none}
.place:empty{display:none}

.card{position:fixed;left:4.5rem;bottom:4rem;width:min(54rem,calc(100vw - 9rem));padding:1.75rem 2.25rem;border-radius:1.5rem;
  background:var(--panel);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1.9rem 3.75rem rgba(0,0,0,.45);
  display:flex;align-items:center;gap:2rem}
.play{flex:0 0 auto;width:6.75rem;height:6.75rem;border:0;border-radius:50%;background:var(--ink);color:#0A1638;display:grid;place-items:center;
  cursor:pointer;box-shadow:0 0 0 .375rem rgba(224,38,47,.35)}
.play svg{width:2.75rem;height:2.75rem}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:.35rem}
.status{display:flex;align-items:center;gap:.75rem;font-family:'Saira Condensed',sans-serif;font-size:1.375rem;font-weight:700;letter-spacing:.22em;color:var(--muted)}
.status .dot{width:.75rem;height:.75rem;border-radius:50%;background:var(--muted)}
.playing .status{color:var(--red)} .playing .status .dot{background:var(--red)}
.name{font-size:2.6rem;font-weight:900;font-style:italic;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.where{font-size:1.45rem;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.extra{font-family:'Saira Condensed',sans-serif;font-size:1.2rem;font-weight:600;letter-spacing:.08em;color:#7F8BAA;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:.75rem}
.fav{width:4.5rem;height:4.5rem;border:0;border-radius:50%;background:var(--chip);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.fav svg{width:2rem;height:2rem}
.fav[aria-pressed="true"]{color:var(--red)} .fav[aria-pressed="true"] path{fill:var(--red)}
.fav-icon{width:3.25rem;height:3.25rem;border-radius:.6rem;object-fit:cover;background:#fff}
.more{font-family:'Saira Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:.12em;color:var(--muted);white-space:nowrap}

.hints{position:fixed;right:4.5rem;bottom:4.5rem;display:flex;flex-direction:column;align-items:flex-end;gap:.85rem;
  font-family:'Saira Condensed',sans-serif;font-size:1.375rem;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.hints .row{display:flex;align-items:center;gap:.85rem}
.key{padding:.25rem .75rem;border-radius:.5rem;box-shadow:inset 0 0 0 .125rem rgba(255,255,255,.25);color:var(--ink)}
.zoom{display:flex;gap:.6rem;pointer-events:auto}
.zoom button{width:3.25rem;height:3.25rem;border:0;border-radius:50%;background:rgba(255,255,255,.07);font-size:1.75rem;font-weight:700;cursor:pointer}

.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,9,26,.72);z-index:5}
.overlay[hidden]{display:none}
.overlay .box{max-width:40rem;padding:2.5rem 3rem;border-radius:1.5rem;background:var(--panel-solid);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.overlay h2{margin:0 0 .75rem;font-size:2.2rem;font-style:italic;font-weight:900}
.overlay p{margin:0 0 1.5rem;font-size:1.4rem;color:var(--muted);line-height:1.4}
.overlay button{height:3.5rem;padding:0 2rem;border:0;border-radius:1.75rem;background:var(--ink);color:#0A1638;font-weight:800;font-size:1.4rem;cursor:pointer}

.toast{position:fixed;left:50%;top:calc(50% - 10rem);transform:translateX(-50%);padding:.6rem 1.25rem;border-radius:.75rem;
  background:var(--panel-solid);box-shadow:inset 0 0 0 1px var(--line);font-size:1.3rem;font-weight:600;pointer-events:none;white-space:nowrap}
.toast[hidden]{display:none}

@media (max-aspect-ratio:1/1){
  .top{left:1rem;top:1rem;gap:.5rem}
  .logo{width:9rem}
  .meta .title{font-size:1.1rem} .meta .sub{font-size:.95rem}
  .cats{left:0;right:0;top:auto;bottom:calc(14rem + env(safe-area-inset-bottom));flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 1rem;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cat{height:2.6rem;font-size:1.05rem;flex:0 0 auto}
  .card{left:.75rem;right:.75rem;width:auto;bottom:calc(.75rem + env(safe-area-inset-bottom));padding:1rem 1.1rem;gap:1rem}
  .play{width:4.5rem;height:4.5rem} .play svg{width:1.9rem;height:1.9rem}
  .name{font-size:1.6rem} .where{font-size:1.05rem} .status{font-size:1rem} .extra{font-size:.95rem}
  .fav{width:3.25rem;height:3.25rem} .fav svg{width:1.5rem;height:1.5rem} .fav-icon{display:none}
  .hints{display:none}
  .reticle{width:5.5rem;height:5.5rem;margin:-2.75rem 0 0 -2.75rem}
  .place{top:calc(50% + 4.2rem);font-size:1rem}
}
</style>
</head>

/* ---------- projection (Web Mercator) ---------- */

  return [W / 2 + dl * view.z, H / 2 - (mercY(lat) - mercY(view.lat)) * kY()];

/* ---------- drawing ---------- */
let drawQueued = false;
function requestDraw() { if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); } }
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  if (!resize.done) { view.z = Math.max(W / 200, 3.2); resize.done = true; }
  requestDraw();
}
function draw() {
  drawQueued = false;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const step = Math.max(7, Math.round(Math.min(W, H) / 98));
  const rDot = step * 0.16;
  ctx.fillStyle = 'rgba(74,102,178,.78)';
  const lons = [];
  for (let x = step / 2; x < W; x += step) lons.push([x, view.lon + (x - W / 2) / view.z]);
  for (let y = step / 2; y < H; y += step) {
    const lat = unprojectLat(y);
    if (lat > 84 || lat < -60) continue;
    ctx.beginPath();
    for (const [x, lon] of lons) {
      if (isLand(lat, lon)) { ctx.moveTo(x + rDot, y); ctx.arc(x, y, rDot, 0, Math.PI * 2); }
    }
    ctx.fill();
  }

  const pad = 20;
  ctx.fillStyle = 'rgba(160,190,255,.16)';
  ctx.beginPath();
  for (const s of spots) {
    const [x, y] = project(s.lat, s.lon);
    s.x = x; s.y = y;
    s.vis = x > -pad && x < W + pad && y > -pad && y < H + pad;
    if (!s.vis) continue;
    const r = 5 + Math.min(5, Math.log2(s.stations.length + 1) * 1.6);
    ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2);
  }
  ctx.fill();
  ctx.fillStyle = 'rgba(205,220,255,.95)';
  ctx.beginPath();
  for (const s of spots) {
    if (!s.vis) continue;
    const r = 1.8 + Math.min(2.4, Math.log2(s.stations.length + 1) * .7);
    ctx.moveTo(s.x + r, s.y); ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
  }
  ctx.fill();
  if (tuned && tuned.vis) {
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(tuned.x, tuned.y, 5, 0, Math.PI * 2); ctx.fill();
  }
}

// Live Radio Browser servers (at1, fi1 and nl1 have gone away); "all" is their round-robin address.
const HOSTS = [...['de1', 'de2'].sort(() => Math.random() - .5), 'all'];
let goodHost = null;
async function api(path, ms) {
  const order = goodHost ? [goodHost, ...HOSTS.filter((h) => h !== goodHost)] : HOSTS;
  let lastErr;
  for (const h of order) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 12000);
    try {
      const r = await fetch(`https://${h}.api.radio-browser.info${path}`, { signal: ctl.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      goodHost = h;
      return j;
    } catch (e) { clearTimeout(t); lastErr = e; }
  }
  throw lastErr || new Error('No server answered');
}
function usable(s) {
  const u = s.url_resolved || s.url;
  if (!u || !/^https?:/i.test(u)) return false;
  if (httpsOnly && !u.startsWith('https:')) return false;
  if (s.hls && !canHls && !canMse) return false;
  const geo = typeof s.geo_lat === 'number' && typeof s.geo_long === 'number' && !(s.geo_lat === 0 && s.geo_long === 0);
  return geo || !!s.countrycode;                       // no coordinates: placed in its state or country
}
function slim(s) {
  const geo = typeof s.geo_lat === 'number' && typeof s.geo_long === 'number' && !(s.geo_lat === 0 && s.geo_long === 0);
  return {
    id: s.stationuuid, name: (s.name || '').trim() || 'Unnamed station', url: s.url_resolved || s.url,
    glat: geo ? s.geo_lat : null, glon: geo ? s.geo_long : null, state: (s.state || '').trim(), country: s.country || '', cc: (s.countrycode || '').toUpperCase(),
    tags: (s.tags || '').toLowerCase(), lang: (s.language || '').toLowerCase(), codec: s.codec || '', bitrate: s.bitrate || 0,
    favicon: s.favicon || '', clicks: s.clickcount || 0, hls: !!s.hls,
  };
}

/* The whole Radio Browser directory, most-listened first: the first page comes in fast so the map is
   usable right away, the rest streams in behind it, and the list is kept on the device for 3 days. */
const FIRST = 1500, PAGE = 5000, MAX_PAGES = 30, KEEP_MS = 3 * 86400000;

  return new Promise((res, rej) => {
    try { const r = indexedDB.open('jrdio', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch (e) { rej(e); }
  });
}
async function idbGet(k) { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } }

function pagePath(offset, limit) {
  const p = new URLSearchParams({ hidebroken: 'true', order: 'clickcount', reverse: 'true', offset: String(offset), limit: String(limit) });
  if (httpsOnly) p.set('is_https', 'true');
  return '/json/stations/search?' + p.toString();
}
async function fetchAll(quiet) {
  const out = [], seen = new Set();
  let offset = 0;
  for (let page = 0; page < MAX_PAGES; page++) {
    const limit = page ? PAGE : FIRST;
    let list;
    try { list = await api(pagePath(offset, limit), 60000); }
    catch (e) { if (!out.length && !quiet) throw e; break; }
    for (const st of list) if (st && !seen.has(st.stationuuid) && usable(st)) { seen.add(st.stationuuid); out.push(slim(st)); }
    offset += limit;
    if (!quiet) { all = out; place(); refresh(page === 0); setCount(); }
    if (list.length < limit) break;
  }
  all = out; allDone = true; place(); refresh(false); setCount();
  idbSet('stations', { t: Date.now(), httpsOnly, list: out });
}
async function boot() {
  const saved = await idbGet('stations');
  if (saved && saved.list && saved.list.length && saved.httpsOnly === httpsOnly && Date.now() - saved.t < KEEP_MS) {
    all = saved.list; allDone = true; place(); refresh(true); setCount();
    if (Date.now() - saved.t > 86400000) fetchAll(true).catch(() => {});   // freshen quietly once a day
    return;
  }
  try { await fetchAll(false); }
  catch (e) { showOverlay("Can't reach the stations", 'The station directory did not answer. Check the internet connection, then try again.', () => { hideOverlay(); boot(); }); }
}

let shown = 0;
function refresh(retune) {
  const list = cat.fav ? Object.values(favs) : cat.id === 'all' ? placed : placed.filter((s) => matches(cat, s));
  shown = list.length;
  const keep = tuned && tuned.stations[stIdx];
  spots = buildSpots(list);
  if (keep && !retune) tuned = spots.find((sp) => sp.stations.some((s) => s.id === keep.id)) || tuned;
  if (retune) tuned = null;
  hideOverlay();
  requestDraw();
  if (retune) settle(true);
}
function setCount() {
  const n = shown;
  if (!all.length && !allDone) { els.count.textContent = 'Loading stations…'; return; }
  if (cat.fav) { els.count.textContent = n ? n.toLocaleString() + ' favorite' + (n === 1 ? '' : 's') : 'No favorites yet — tap the heart'; return; }
  const more = allDone ? '' : ' · loading more…';
  els.count.textContent = n.toLocaleString() + ' live stations' + (cat.id === 'all' ? '' : ' · ' + cat.label) + more;
}
function selectCategory(c) {
  cat = c;
  renderCats();
  refresh(true);
  setCount();
}

/* ---------- tuning ---------- */
let settleTimer = 0;
function nearestSpot() {
  const R = Math.max(36, Math.min(W, H) * 0.06);
  let best = null, bd = R * R;
  for (const s of spots) {
    if (!s.vis) continue;
    const dx = s.x - W / 2, dy = s.y - H / 2, d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function settle(now) {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    draw();
    const s = nearestSpot();
    if (s === tuned) return;
    tuned = s; stIdx = 0;
    showTuned();
    if (s && started) playStation(s.stations[0]);
    requestDraw();
  }, now ? 0 : 650);
}
function showTuned() {
  const st = tuned ? tuned.stations[stIdx] : null;
  if (!st) {
    els.place.textContent = '';
    if (!current) {
      els.name.textContent = spots.length ? 'Roam the map to find a station' : 'No stations in this category';
      els.where.textContent = (window.matchMedia && matchMedia('(pointer: coarse)').matches) ? 'Drag the map · tap a dot to tune' : 'Arrows move the map · OK plays';
      els.extra.textContent = ''; els.more.textContent = '';
    }
    return;
  }
  els.place.textContent = placeOf(st);
  if (!started) {
    els.name.textContent = st.name;
    els.where.textContent = whereOf(st);
    els.extra.textContent = extraOf(st);
    els.more.textContent = tuned.stations.length > 1 ? '1 / ' + tuned.stations.length : '';
    setFavUI(st);
  }
}
const placeOf = (s) => (s.state && s.cc ? s.state + ', ' + s.cc : s.country || s.cc);
const whereOf = (s) => [s.state, s.country].filter(Boolean).join(' · ');
function extraOf(s) {
  const tags = s.tags.split(',').map((t) => t.trim()).filter(Boolean).slice(0, 3).join(' · ');
  const q = [s.codec, s.bitrate ? s.bitrate + ' kbps' : ''].filter(Boolean).join(' ');
  return [tags, q].filter(Boolean).join('   ·   ');
}

/* ---------- playback ---------- */
let stallTimer = 0, playToken = 0;
const HLS_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.16/hls.light.min.js';
let hls = null, hlsLoading = null;
function loadHls() {
  if (window.Hls) return Promise.resolve();
  if (!hlsLoading) hlsLoading = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = HLS_SRC; sc.onload = res;
    sc.onerror = () => { hlsLoading = null; rej(new Error('hls.js')); };
    document.head.appendChild(sc);
  });
  return hlsLoading;
}
function stopHls() { if (hls) { try { hls.destroy(); } catch (e) { /* gone */ } hls = null; } }
function setStatus(t) { els.status.textContent = t; }
function setPlayingUI(on) {
  playing = on;
  document.body.classList.toggle('playing', on);
  els.iconPlay.style.display = on ? 'none' : '';
  els.iconPause.style.display = on ? '' : 'none';
  els.play.setAttribute('aria-label', on ? 'Pause' : 'Play');
}
function playStation(st) {
  if (!st) return;
  started = true;
  current = st;
  const token = ++playToken;
  els.name.textContent = st.name;
  els.where.textContent = whereOf(st);
  els.extra.textContent = extraOf(st);
  els.more.textContent = tuned && tuned.stations.length > 1 ? (stIdx + 1) + ' / ' + tuned.stations.length : '';
  setFavUI(st);
  if (st.favicon) { els.favicon.src = st.favicon; els.favicon.hidden = false; } else { els.favicon.hidden = true; }
  setStatus('TUNING…');
  setPlayingUI(false);
  clearTimeout(stallTimer);
  stopHls();
  const start = () => { const p = audio.play(); if (p && p.catch) p.catch(() => { if (token === playToken) offline(token); }); };
  if ((st.hls || /\.m3u8(\?|$)/i.test(st.url)) && !canHls) {
    audio.removeAttribute('src');
    loadHls().then(() => {
      if (token !== playToken) return;
      if (!window.Hls || !Hls.isSupported()) { offline(token); return; }
      hls = new Hls({ enableWorker: true, lowLatencyMode: false });
      hls.on(Hls.Events.ERROR, (ev, d) => { if (d && d.fatal && token === playToken) offline(token); });
      hls.loadSource(st.url); hls.attachMedia(audio);
      start();
    }).catch(() => offline(token));
  } else {
    audio.src = st.url;
    start();
  }
  stallTimer = setTimeout(() => { if (token === playToken && !playing) offline(token); }, 12000);
  api('/json/url/' + encodeURIComponent(st.id)).catch(() => {});
}
function offline(token) {
  if (token !== playToken) return;
  setStatus('STATION OFFLINE');
  setPlayingUI(false);
  if (tuned && tuned.stations.length > 1 && stIdx < tuned.stations.length - 1) {
    toast('That one is off the air — trying the next station here');
    stIdx++;
    setTimeout(() => { if (token === playToken) playStation(tuned.stations[stIdx]); }, 900);
  }
}
audio.addEventListener('playing', () => { clearTimeout(stallTimer); setPlayingUI(true); setStatus('ON AIR' + (cat.id === 'all' || cat.fav ? '' : ' · ' + cat.label.toUpperCase())); });
audio.addEventListener('waiting', () => { if (current) setStatus('BUFFERING…'); });
audio.addEventListener('pause', () => { if (current && !audio.ended) { setPlayingUI(false); setStatus('PAUSED'); } });
audio.addEventListener('error', () => { if (audio.error && !hls) offline(playToken); });

function okPressed() {
  if (focusCats) { selectCategory(CATS[catCursor]); setFocusCats(false); return; }
  if (!tuned) {
    if (current) togglePlay(); else toast('Move the map until the red ring sits on a station');
    return;
  }
  if (current && tuned.stations.includes(current) && tuned.stations.length > 1 && playing) {
    stIdx = (stIdx + 1) % tuned.stations.length;
  } else if (current && tuned.stations.includes(current) && !playing) {
    togglePlay(); return;
  }
  playStation(tuned.stations[stIdx]);
}
function togglePlay() {
  if (!current) { okPressed(); return; }
  if (playing) { audio.pause(); }
  else if (hls) { const tok = playToken; setStatus('TUNING…'); const p = audio.play(); if (p && p.catch) p.catch(() => offline(tok)); }
  else { const tok = ++playToken; setStatus('TUNING…'); audio.load(); const p = audio.play(); if (p && p.catch) p.catch(() => offline(tok)); }
}

/* ---------- favorites ---------- */
function loadFavs() { try { return JSON.parse(localStorage.getItem('jrdio:favs') || '{}'); } catch (e) { return {}; } }
function saveFavs() { try { localStorage.setItem('jrdio:favs', JSON.stringify(favs)); } catch (e) { /* storage off */ } }
function setFavUI(st) {
  const on = !!(st && favs[st.id]);
  els.fav.setAttribute('aria-pressed', on ? 'true' : 'false');
  els.fav.setAttribute('aria-label', on ? 'Remove from favorites' : 'Add to favorites');
}
function toggleFav() {
  const st = current || (tuned && tuned.stations[stIdx]);
  if (!st) return;
  if (favs[st.id]) { delete favs[st.id]; toast('Removed from favorites'); } else { favs[st.id] = st; toast('Saved to favorites'); }
  saveFavs(); setFavUI(st);
  if (cat.fav) selectCategory(cat);
}

/* ---------- moving the map ---------- */
let anim = 0;
function panBy(dxPx, dyPx, smooth) {
  const toLon = view.lon + dxPx / view.z;
  const toLat = unprojectLat(H / 2 + dyPx);
  if (!smooth) { view.lon = wrapLon(toLon); view.lat = clampLat(toLat); requestDraw(); settle(); return; }
  animateTo(toLat, toLon, view.z, 220);
}
function zoomBy(f) { animateTo(view.lat, view.lon, Math.max(2.5, Math.min(160, view.z * f)), 220); }
function animateTo(lat, lon, z, ms) {
  cancelAnimationFrame(anim);
  const a = { lat: view.lat, lon: view.lon, z: view.z }, t0 = performance.now();
  let dl = ((lon - a.lon + 540) % 360) - 180;
  const tick = (t) => {
    const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3);
    view.lat = clampLat(a.lat + (lat - a.lat) * e);
    view.lon = wrapLon(a.lon + dl * e);
    view.z = a.z * Math.pow(z / a.z, e);
    draw();
    if (k < 1) anim = requestAnimationFrame(tick); else settle();
  };
  anim = requestAnimationFrame(tick);
}
const wrapLon = (l) => ((l + 540) % 360) - 180;
const clampLat = (l) => Math.max(-70, Math.min(80, l));

/* ---------- input: remote / keyboard ---------- */
function setFocusCats(on) {
  focusCats = on;
  els.cats.classList.toggle('focus', on);
  if (on) catCursor = CATS.indexOf(cat);
  renderCats();
}
window.addEventListener('keydown', (e) => {
  const k = e.key, code = e.keyCode;
  const step = Math.min(W, H) * 0.18;
  if (!els.overlay.hidden) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); els.ovBtn.click(); }
    return;
  }
  if (focusCats) {
    if (k === 'ArrowLeft') { catCursor = Math.max(0, catCursor - 1); renderCats(); }
    else if (k === 'ArrowRight') { catCursor = Math.min(CATS.length - 1, catCursor + 1); renderCats(); }
    else if (k === 'Enter' || k === ' ') okPressed();
    else if (k === 'ArrowDown' || k === 'Escape' || k === 'ContextMenu' || code === 82 || k === 'c') setFocusCats(false);
    else return;
    e.preventDefault(); return;
  }
  if (k === 'ArrowLeft') panBy(-step, 0, true);
  else if (k === 'ArrowRight') panBy(step, 0, true);
  else if (k === 'ArrowUp') panBy(0, -step, true);
  else if (k === 'ArrowDown') panBy(0, step, true);
  else if (k === 'Enter' || k === ' ') okPressed();
  else if (k === '+' || k === '=' || k === 'PageUp' || k === 'MediaFastForward' || code === 228) zoomBy(1.6);
  else if (k === '-' || k === '_' || k === 'PageDown' || k === 'MediaRewind' || code === 227) zoomBy(1 / 1.6);
  else if (k === 'MediaPlayPause' || code === 179 || k === 'p') togglePlay();
  else if (k === 'ContextMenu' || code === 82 || code === 93 || k === 'c') setFocusCats(true);
  else if (k === 'f') toggleFav();
  else if (k === 'h') animateTo(HOME.lat, HOME.lon, view.z, 400);
  else return;
  e.preventDefault();
});

/* ---------- input: mouse / touch ---------- */
const ptrs = new Map();
let dragMoved = false, pinch0 = 0, z0 = 0;
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragMoved = false;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = view.z; }
  canvas.classList.add('dragging');
  cancelAnimationFrame(anim);
});
canvas.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch0) { view.z = Math.max(2.5, Math.min(160, z0 * d / pinch0)); requestDraw(); }
    dragMoved = true; return;
  }
  if (Math.abs(dx) + Math.abs(dy) > 0) {
    if (Math.abs(dx) + Math.abs(dy) > 2) dragMoved = true;
    view.lon = wrapLon(view.lon - dx / view.z);
    view.lat = clampLat(unprojectLat(H / 2 - dy));
    requestDraw();
  }
});
function endPtr(e) {
  const was = ptrs.get(e.pointerId);
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch0 = 0;
  if (!ptrs.size) canvas.classList.remove('dragging');
  if (!was) return;
  if (!dragMoved && e.type === 'pointerup') {
    // tap: centre the nearest station under the finger and play it
    let best = null, bd = 40 * 40;
    for (const s of spots) {
      if (!s.vis) continue;
      const d = (s.x - e.clientX) ** 2 + (s.y - e.clientY) ** 2;
      if (d < bd) { bd = d; best = s; }
    }
    if (best) { started = true; animateTo(best.lat, best.lon, view.z, 300); }
    return;
  }
  settle();
}
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', (e) => { e.preventDefault(); view.z = Math.max(2.5, Math.min(160, view.z * Math.pow(1.0015, -e.deltaY))); requestDraw(); settle(); }, { passive: false });

els.play.addEventListener('click', () => { if (!current && tuned) { started = true; playStation(tuned.stations[stIdx]); } else togglePlay(); });
els.fav.addEventListener('click', toggleFav);
$('zoom-in').addEventListener('click', () => zoomBy(1.6));
$('zoom-out').addEventListener('click', () => zoomBy(1 / 1.6));
els.favicon.addEventListener('error', () => { els.favicon.hidden = true; });

/* ---------- categories bar ---------- */
function renderCats() {
  if (!els.cats.children.length) {
    for (const c of CATS) {
      const b = document.createElement('button');
      b.className = 'cat'; b.type = 'button'; b.textContent = c.label;
      b.addEventListener('click', () => { setFocusCats(false); selectCategory(c); });
      els.cats.appendChild(b);
    }
  }
  [...els.cats.children].forEach((b, i) => {
    b.setAttribute('aria-pressed', CATS[i] === cat ? 'true' : 'false');
    b.classList.toggle('cursor', focusCats && i === catCursor);
  });
  const sel = els.cats.children[focusCats ? catCursor : CATS.indexOf(cat)];
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

/* ---------- small UI helpers ---------- */
let toastTimer = 0;
function toast(t) { els.toast.textContent = t; els.toast.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { els.toast.hidden = true; }, 2600); }
let ovAction = null;
function showOverlay(title, text, action) { els.ovTitle.textContent = title; els.ovText.textContent = text; ovAction = action; els.overlay.hidden = false; els.ovBtn.focus(); }
function hideOverlay() { els.overlay.hidden = true; }
els.ovBtn.addEventListener('click', () => { hideOverlay(); if (ovAction) ovAction(); });

/* ---------- go ---------- */
if (window.matchMedia && matchMedia('(pointer: coarse)').matches) {
  els.status.textContent = 'TAP PLAY TO LISTEN';
  els.where.textContent = 'Drag the map · tap a dot to tune';
}
window.addEventListener('resize', resize);
resize();
renderCats();
setCount();
boot();
// Inside the Fire Stick app, the remote's Back button closes the category bar or a message first.
window.bsoBack = () => {
  if (!els.overlay.hidden) { hideOverlay(); return true; }
  if (focusCats) { setFocusCats(false); return true; }
  return false;
};
})();
</script>
</body>
</html>
